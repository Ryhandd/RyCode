<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RyCode</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <aside id="side">
      <header><b>RY<span>CODE</span></b><button id="open" title="Buka folder (Ctrl+O)">Open</button></header>
      <div id="tree" tabindex="0" aria-label="File explorer"></div>
    </aside>
    <main>
      <div id="tabs"></div>
      <div id="editor"></div>
      <div id="gutter" role="separator" aria-orientation="horizontal" aria-label="Ubah tinggi terminal" aria-valuemin="80" tabindex="0" title="Drag untuk resize · klik 2x untuk reset"></div>
      <section id="term">
        <div id="out"></div>
        <div class="in"><i>$</i><input id="cmd" spellcheck="false" autocomplete="off" aria-label="Terminal"></div>
      </section>
      <footer id="bar"><span id="msg"></span><span id="hint">Ctrl+S simpan · Ctrl+P cari · Ctrl+O folder · Ctrl+` terminal <button id="hbtn" title="Daftar shortcut (F1)">F1 Shortcuts</button></span></footer>
    </main>
  </div>
  <div id="qo" hidden><input id="qi" placeholder="Cari file…" aria-label="Cari file"><ul id="ql"></ul></div>
  <div id="hp" hidden role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"><div id="hpcard" tabindex="-1"></div></div>
  <div id="ctx" hidden><button id="ctxdel">Hapus <kbd>Del</kbd></button></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
